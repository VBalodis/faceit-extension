<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FACEIT Deathnote</title>

    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <main class="popup">

        <header class="header">
            <div>
                <h1>FACEIT Deathnote</h1>
                <p>Player reporting assistant</p>
            </div>

            <span class="version">
                v1.0.1
            </span>
        </header>


        <section class="status-card">

            <div class="status-info">

                <span class="status-label">
                    Extension status
                </span>

                <div class="status-row">

                    <span
                        id="statusDot"
                        class="status-dot"
                    ></span>

                    <span
                        id="statusText"
                        class="status-text"
                    >
                        Loading...
                    </span>

                </div>

            </div>

        </section>


        <button
            id="toggleBtn"
            class="toggle-btn"
        >
            Loading...
        </button>


        <footer>
            <span>FACEIT Deathnote</span>
        </footer>

    </main>


    <script src="popup.js"></script>

</body>
</html>
